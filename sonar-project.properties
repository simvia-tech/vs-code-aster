sonar.projectKey=vs-code-aster
sonar.projectName=VS Code Aster

sonar.sources=src,webviews,python/lsp,python/med2obj.py,python/mesh_groups.py
sonar.tests=tests,python/tests
sonar.test.inclusions=**/*.test.ts,tests/**,python/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/coverage/**

# Coverage and lint findings produced by the test jobs, see .github/workflows/test.yml
sonar.python.coverage.reportPaths=reports/coverage-python.xml
sonar.javascript.lcov.reportPaths=reports/lcov-ts.info
sonar.sarifReportPaths=reports/lint-ts.sarif,reports/lint-python.sarif
