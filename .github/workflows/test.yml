name: Tests

on:
  push:
  pull_request:
  # Daily run for the quality dashboard: new CVEs appear without any commit.
  schedule:
    - cron: "30 1 * * *"

jobs:
  unit-web:
    name: TS unit + webview (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15
      - name: Install npm dependencies
        run: npm install
      # Lint findings for the quality dashboard; ci.yml enforces the rules.
      - name: ESLint (SARIF)
        run: |
          npm install --no-save @microsoft/eslint-formatter-sarif
          mkdir -p reports
          npx eslint src/ webviews/export/ -f @microsoft/eslint-formatter-sarif -o reports/lint-ts.sarif || true
      - name: Vitest (unit + webviews)
        run: >
          npx vitest run --coverage
          --reporter=default --reporter=junit --outputFile.junit=reports/junit-ts.xml
      - if: always()
        run: |
          cp coverage/cobertura-coverage.xml reports/coverage-ts.xml
          cp coverage/lcov.info reports/lcov-ts.info
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-ts
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html-ts
          path: coverage/

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs only need the Python version the quality reports come from.
        python: ${{ fromJSON(github.event_name == 'schedule' && '["3.12"]' || '["3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Pytest
        # medcoupling-gated mesh tests auto-skip; CATA loads from the vendored
        # catalog with only numpy installed.
        run: >
          python -m pytest python/tests -q --cov
          --cov-report=xml:reports/coverage-python.xml --cov-report=html:coverage-python
          --junitxml=reports/junit-python.xml
      # One Python version is enough for the quality metrics.
      - if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: reports-python
          path: reports/
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-python
          path: coverage-python/

  # Reports read by the quality dashboard (quality.simvia.internal), from the template of
  # simvia/common-tools/quality (templates/github-actions.yml).
  quality-reports:
    name: Quality reports
    needs: [unit-web, python]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      PYTHON_PATHS: "python/lsp python/med2obj.py python/mesh_groups.py"
      JSCPD_PATHS: "src webviews/*/src webviews/shared python/lsp python/med2obj.py python/mesh_groups.py"  # test files excluded in .jscpd.json
      DOCS_SITE_DIR: ""  # no docs website
      DOCS_BUILD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        continue-on-error: true  # no test job uploaded reports
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true
      - name: Collect quality reports
        shell: bash
        run: |
          # Each block is one && chain: a failing tool only leaves its metric at n/a.
          mkdir -p reports
          fetch() { curl -sSfL --retry 3 --retry-all-errors "$@"; }
          # Scanners exit 1 (osv-scanner) or 2 (lychee) when they find something: still a valid report.
          found_ok() { s=$?; [ $s -eq 0 ] || [ $s -eq "$1" ]; }

          echo "== Vulnerable dependencies (osv-scanner, every lockfile)"
          fetch -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 &&
            chmod +x /tmp/osv-scanner &&
            { /tmp/osv-scanner scan source -r --format sarif --output-file reports/vulns-osv.sarif . > /dev/null; found_ok 1; } ||
            echo "skipped"

          echo "== Duplication (jscpd)"
          npx -y jscpd@4 $JSCPD_PATHS --gitignore --reporters json --output reports --silent || echo "skipped"

          if [ -n "$PYTHON_PATHS" ]; then
            echo "== Python lint (ruff) and documented share (interrogate)"
            fetch https://astral.sh/uv/0.9.5/install.sh | sh > /dev/null &&
              export PATH="$HOME/.local/bin:$PATH" &&
              uvx ruff@0.15.6 check $PYTHON_PATHS --exit-zero --output-format sarif -o reports/lint-python.sarif &&
              uv run -q --no-project --with interrogate==1.7.0 python - $PYTHON_PATHS <<'EOF' || echo "skipped"
          import json, sys
          from interrogate import config, coverage
          conf = config.InterrogateConfig(ignore_private=True, ignore_semiprivate=True, ignore_magic=True, ignore_nested_functions=True)
          r = coverage.InterrogateCoverage(paths=sys.argv[1:], conf=conf).get_coverage()
          json.dump({"total": r.total, "missing": r.missing}, open("reports/docs-python.json", "w"))
          EOF
          fi

          if [ -n "$DOCS_SITE_DIR" ]; then
            echo "== Broken links of the docs website (lychee)"
            { [ -z "$DOCS_BUILD" ] || sh -c "$DOCS_BUILD"; } &&
              fetch https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp &&
              { /tmp/lychee-x86_64-unknown-linux-musl/lychee --no-progress --exclude-all-private --root-dir "$PWD/$DOCS_SITE_DIR" --fallback-extensions html \
                  --format json --output reports/links-docs.json "$DOCS_SITE_DIR/**/*.html"; found_ok 2; } ||
              echo "skipped"
          fi
          ls -l reports
      - uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/

  # Analysis on the internal SonarQube (sonar.simvia.internal), reached through a NetBird tunnel.
  # Skipped until the secrets SONAR_TOKEN and NETBIRD_SETUP_KEY and the variable SONAR_HOST_URL exist.
  sonar:
    name: SonarQube
    needs: [quality-reports]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' && secrets.NETBIRD_SETUP_KEY != '' && vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # blame data and new code detection
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*reports*"
          path: reports/
          merge-multiple: true
      - name: Join the NetBird network
        if: env.SONAR_ENABLED == 'true'
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          curl -sSfL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "gh-vs-code-aster-$GITHUB_RUN_ID"
          host=$(echo "$SONAR_HOST_URL" | sed -E 's|^[a-z]+://||; s|[:/].*||')  # without scheme, port or path
          for _ in $(seq 30); do getent hosts "$host" && break; sleep 2; done
          getent hosts "$host"
          # Private CA of the internal services, for the Java scanner.
          keytool -importcert -noprompt -alias simvia -file ci/simvia-ca.crt \
            -keystore "$RUNNER_TEMP/simvia.jks" -storepass changeit
          echo "SONAR_SCANNER_OPTS=-Djavax.net.ssl.trustStore=$RUNNER_TEMP/simvia.jks -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  integration:
    name: VS Code integration (headless)
    # Not part of the quality reports.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Electron download + xvfb; kept non-blocking until proven stable in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15
      - name: Install system libraries for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libgbm1 libasound2t64 xvfb
      - name: Install npm dependencies
        run: npm install
      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}
      - name: Run integration tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:integration
