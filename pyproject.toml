[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["python/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = [
  "python",
  "python/lsp",
  "python/asterstudy/code_aster_version",
  "python/bundled/libs",
]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
files = ["python/lsp"]

[[tool.mypy.overrides]]
module = ["asterstudy.*", "code_aster.*"]
ignore_errors = true
